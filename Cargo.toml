[package]
name = "chess-perft"
version = "0.1.0"
edition = "2024"

[dependencies]
derive_more = { version = "2.1.1", features = ["add", "add_assign", "mul", "mul_assign", "not"] }
arrayvec = "0.7.8" # TODO: Remove once we no longer need a move list
rayon = "1.12.0"

[profile.release]
panic = "abort"
lto = true

[profile.bench]
inherits = "release"
debug = 1

[features]
# Use `pext` from bmi2 if it exists. This is a bad idea on Zen 1 and 2 (i.e. AMD Ryzen 1xxx to 4xxx).
default = ["pext-lookup"]
pext-lookup = []